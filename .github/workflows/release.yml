name: Release

# Pushing a v* tag builds the installers, signs the update bundles and
# publishes a GitHub release with a latest.json that the in-app updater reads.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        name: ${{ matrix.name }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Windows x64
                      platform: windows-latest
                      args: ''
                    - name: macOS Apple silicon
                      platform: macos-latest
                      args: --target aarch64-apple-darwin
                    - name: macOS Intel
                      platform: macos-latest
                      args: --target x86_64-apple-darwin
                    - name: Linux x64
                      platform: ubuntu-22.04
                      args: ''
        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  # wry 0.24 (Tauri 1) does not compile on Linux with Rust 1.95 or newer
                  toolchain: ${{ matrix.platform == 'ubuntu-22.04' && '1.90' || 'stable' }}
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libxcb1 libxrandr2 libdbus-1-3

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build and publish
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: Be Native ${{ github.ref_name }}
                  releaseBody: See the assets below to download and install.
                  releaseDraft: false
                  prerelease: false
                  includeUpdaterJson: true
                  args: ${{ matrix.args }}
